name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-and-eval:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Unit and API tests
        run: pytest -q
      - name: Evaluation release gate
        run: grounded-rag eval --gate
      - uses: actions/upload-artifact@v4
        if: always() && matrix.python-version == '3.12'
        with:
          name: eval-report
          path: eval/results/

  docker:
    runs-on: ubuntu-latest
    needs: test-and-eval
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t grounded-rag-eval .
      - name: Smoke test
        run: |
          docker run -d -p 8000:8000 --name api grounded-rag-eval
          for i in $(seq 1 20); do curl -fs localhost:8000/health && break; sleep 1; done
          curl -fs -X POST localhost:8000/ask -H 'content-type: application/json' \
            -d '{"question":"How often do sondes record a reading?"}' | grep -q '15 minutes'
      - name: Container logs
        if: failure()
        run: docker logs api
